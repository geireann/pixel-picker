<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Frame Border -->
  <rect x="0" y="0" width="16" height="16" fill="#09090b"/>
  <rect x="1" y="1" width="14" height="14" fill="#f4f4f5"/>
  
  <!-- Pixel Grid Art Pattern -->
  <rect x="3" y="3" width="3" height="3" fill="#dc2626"/>
  <rect x="7" y="3" width="3" height="3" fill="#09090b"/>
  <rect x="11" y="3" width="2" height="3" fill="#38bdf8"/>

  <rect x="3" y="7" width="3" height="3" fill="#09090b"/>
  <rect x="7" y="7" width="3" height="3" fill="#dc2626"/>
  <rect x="11" y="7" width="2" height="3" fill="#09090b"/>

  <rect x="3" y="11" width="3" height="2" fill="#38bdf8"/>
  <rect x="7" y="11" width="3" height="2" fill="#09090b"/>
  <rect x="11" y="11" width="2" height="2" fill="#dc2626"/>

  <!-- Inner Split Flap Seam Line -->
  <line x1="1" y1="8" x2="15" y2="8" stroke="rgba(9, 9, 11, 0.15)" stroke-width="0.5"/>
</svg>
