apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pixel-picker-server
  namespace: geireann
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/sessionAffinity: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/geireann/pixel-picker-server:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            memory: 512Mi
            cpu: "1.0"
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "8080"
